# Создать новый application.properties для H2
@"
server.port=8080
spring.application.name=explore-with-me-main

# H2 Database
spring.datasource.url=jdbc:h2:mem:explorewithme_main
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Stats Server
stats-server.url=http://localhost:9090

# Logging
logging.level.ru.practicum=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Jackson
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
spring.jpa.open-in-view=false
"@ | Out-File -FilePath "ewm-main-service\src\main\resources\application.properties" -Encoding UTF8